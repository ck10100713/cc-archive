<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Archive</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --panel-2: #f1efea; --line: #e6e3dc; --line-2: #d8d4ca;
  --text: #1d1c1a; --muted: #6f6b63; --faint: #9c978d;
  --accent: #c8613d; --accent-soft: #f7e4dc; --accent-text: #a44a29;
  --good: #3d7d5a; --good-soft: #e1efe6; --info: #3f62a8; --info-soft: #e3e9f6;
  --heat-0: #ebe8e1; --heat-1: #f2cdbd; --heat-2: #e59a7b; --heat-3: #d06a45; --heat-4: #9f3f1e;
  --shadow: 0 1px 2px rgba(30,25,15,.05), 0 4px 16px rgba(30,25,15,.06);
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --panel: #1f1e1c; --panel-2: #282624; --line: #33302d; --line-2: #45413c;
    --text: #ecebe7; --muted: #a8a399; --faint: #78736a;
    --accent: #e07a55; --accent-soft: #3a2820; --accent-text: #f0a183;
    --good: #7cc29a; --good-soft: #1f3128; --info: #8aa8e6; --info-soft: #1f2a40;
    --heat-0: #2a2826; --heat-1: #4d3125; --heat-2: #7d422b; --heat-3: #b85a36; --heat-4: #ee8b62;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --panel: #1f1e1c; --panel-2: #282624; --line: #33302d; --line-2: #45413c;
  --text: #ecebe7; --muted: #a8a399; --faint: #78736a;
  --accent: #e07a55; --accent-soft: #3a2820; --accent-text: #f0a183;
  --good: #7cc29a; --good-soft: #1f3128; --info: #8aa8e6; --info-soft: #1f2a40;
  --heat-0: #2a2826; --heat-1: #4d3125; --heat-2: #7d422b; --heat-3: #b85a36; --heat-4: #ee8b62;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; }
.side {
  border-right: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.logo {
  width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -.5px;
}
.brand b { font-size: 15px; letter-spacing: -.2px; }
.brand small { display: block; color: var(--faint); font-size: 11.5px; }
.nav { padding: 4px 10px 10px; display: grid; gap: 2px; }
.nav button, .proj {
  all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--muted);
}
.nav button:hover, .proj:hover { background: var(--panel-2); color: var(--text); }
.nav button[aria-current="true"], .proj[aria-current="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav .count, .proj .count { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav svg { width: 16px; height: 16px; flex: none; }
.side-scroll { overflow: auto; padding: 0 10px 18px; flex: 1; }
.group-h {
  font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint);
  padding: 16px 10px 6px; display: flex; justify-content: space-between; gap: 8px;
}
.group-h span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj { font-size: 13.5px; }
.proj .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

.main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.top {
  display: flex; gap: 12px; align-items: center; padding: 14px 28px;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 5;
}
.icon-btn.menu-btn { display: none; }
.search { flex: 1; max-width: 640px; position: relative; }
.search input {
  width: 100%; padding: 9px 12px 9px 36px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); outline: none; transition: border-color .15s, box-shadow .15s;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; color: var(--faint); }
.search kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; }
kbd {
  font: 11px ui-monospace, monospace; padding: 2px 6px; border-radius: 5px;
  border: 1px solid var(--line-2); color: var(--faint); background: var(--panel-2);
}
.icon-btn {
  all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  color: var(--muted); border: 1px solid var(--line); background: var(--panel);
}
.icon-btn:hover { color: var(--text); border-color: var(--line-2); }
.icon-btn svg { width: 17px; height: 17px; }
.content { overflow: auto; flex: 1; padding: 24px 28px 60px; }
.wrap { max-width: 1080px; margin: 0 auto; }

/* ---------- overview ---------- */
.page-h { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-h h1 { font-size: 22px; letter-spacing: -.4px; margin: 0; }
.page-h p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
.tile { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--faint); margin-left: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.insights { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; margin-bottom: 22px; }
.card-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; font-weight: 600; font-size: 13px; }
.card-h span { color: var(--faint); font-weight: 400; font-size: 12px; }
.heat { padding: 12px 16px 14px; overflow-x: auto; }
.heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; width: max-content; }
.heat-grid i { width: 12px; height: 12px; border-radius: 3px; background: var(--heat-0); cursor: pointer; }
.heat-grid i:hover { outline: 1.5px solid var(--text); outline-offset: 1px; }
.heat-grid i.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.heat-grid i.empty { visibility: hidden; }
.heat-legend { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--faint); margin-top: 10px; }
.heat-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.heat-months { display: grid; grid-auto-flow: column; gap: 3px; font-size: 10.5px; color: var(--faint); margin-bottom: 4px; width: max-content; }
.heat-months span { width: 12px; white-space: nowrap; }
.toplist { padding: 10px 16px 14px; display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 12.5px; cursor: pointer; }
.bar-row:hover .bar-name { color: var(--accent-text); }
.bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-val { color: var(--faint); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  all: unset; cursor: pointer; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center;
}
.chip:hover { border-color: var(--line-2); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.clear { border-style: dashed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel); }
.seg button { all: unset; cursor: pointer; padding: 3px 11px; border-radius: 999px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); font-weight: 600; }
.spacer { flex: 1; }
select.sort {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; color: var(--muted);
}
.result-n { color: var(--faint); font-size: 12.5px; }

/* ---------- session list ---------- */
.day-h { font-size: 12px; font-weight: 600; color: var(--faint); margin: 20px 4px 8px; display: flex; gap: 8px; }
.list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row {
  all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px;
  padding: 13px 16px; background: var(--panel); transition: background .1s;
}
.row:hover { background: var(--panel-2); }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row[aria-current="true"] { background: var(--accent-soft); }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .when { color: var(--faint); font-size: 12px; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.meta { display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.meta .sep { color: var(--line-2); }
.snippet { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badges { display: flex; gap: 6px; justify-content: flex-end; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600;
  padding: 1px 8px; border-radius: 999px; white-space: nowrap;
}
.badge.compact { background: var(--accent-soft); color: var(--accent-text); }
.badge.pr { background: var(--good-soft); color: var(--good); }
.badge.wt { background: var(--info-soft); color: var(--info); }
.badge.err { background: var(--panel-2); color: var(--faint); }
.pchip { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--text); }
mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty-state { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty-state b { display: block; font-size: 16px; color: var(--text); margin-bottom: 4px; }
.more { display: block; margin: 16px auto 0; }

/* ---------- compacts ---------- */
.cmp { padding: 16px 18px; display: grid; gap: 10px; }
.cmp + .cmp { border-top: 1px solid var(--line); }
.cmp-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.cmp-h .t { font-weight: 600; cursor: pointer; }
.cmp-h .t:hover { color: var(--accent-text); text-decoration: underline; }
.shrink { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.shrink .track { width: 160px; height: 6px; border-radius: 3px; background: var(--accent-soft); position: relative; overflow: hidden; }
.shrink .track i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; min-width: 2px; }
.summary {
  white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.65; color: var(--text);
  background: var(--panel-2); border-radius: 10px; padding: 12px 14px; max-height: 140px; overflow: hidden; position: relative;
}
.summary.open { max-height: none; }
.summary:not(.open)::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 50px;
  background: linear-gradient(transparent, var(--panel-2));
}
.link-btn { all: unset; cursor: pointer; color: var(--accent-text); font-size: 12.5px; font-weight: 600; }
.link-btn:hover { text-decoration: underline; }
.actions { display: flex; gap: 16px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15,12,8,.28); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 21;
  transform: translateX(102%); transition: transform .22s cubic-bezier(.2,.8,.2,1);
  display: flex; flex-direction: column;
}
.drawer.on { transform: none; }
.dr-h { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.dr-h h2 { margin: 0; font-size: 17px; letter-spacing: -.3px; line-height: 1.35; }
.dr-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dr-body { overflow: auto; padding: 6px 22px 40px; flex: 1; }
.primary {
  all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; padding: 8px 14px; border-radius: 9px;
  background: var(--accent); color: #fff; font-weight: 600; font-size: 13px;
}
.primary:hover { filter: brightness(1.06); }
.primary[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 14px; }
.kv div { background: var(--panel); padding: 10px 12px; }
.kv .k { font-size: 11.5px; color: var(--faint); }
.kv .v { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec-h { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 24px 0 10px; display: flex; gap: 8px; align-items: center; }
.sec-h span { font-weight: 500; color: var(--faint); text-transform: none; letter-spacing: 0; }
.recap { border-left: 3px solid var(--info); padding: 2px 0 2px 12px; margin-bottom: 10px; font-size: 13px; }
.recap time { display: block; font-size: 11.5px; color: var(--faint); }
.timeline { display: grid; gap: 0; position: relative; }
.tl { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 7px 0; font-size: 13px; }
.tl time { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.tl .p { white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.tl.cmp-mark .p { color: var(--accent-text); font-weight: 600; }
.tl-day { font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 12px 0 2px; }
.pr-link { display: flex; gap: 8px; align-items: center; padding: 6px 0; font-size: 13px; text-decoration: none; }
.pr-link:hover { color: var(--accent-text); }
.path { font-size: 12px; color: var(--faint); word-break: break-all; }

@media (max-width: 1000px) {
  .tiles { grid-template-columns: repeat(3, 1fr); }
  .insights { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 30; transform: translateX(-102%); transition: transform .2s; }
  .side.on { transform: none; box-shadow: var(--shadow); }
  .icon-btn.menu-btn { display: grid; }
  .top, .content { padding-left: 16px; padding-right: 16px; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .search kbd { display: none; }
  .kv { grid-template-columns: repeat(2, 1fr); }
  .row { grid-template-columns: 1fr; }
  .row .when, .badges { text-align: left; justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">CC</div>
      <div><b>CC Archive</b><small id="gen"></small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-scroll" id="projects"></div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="開啟側欄">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋標題、prompt、compact 摘要、recap…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" aria-label="切換深淺色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </header>
    <main class="content"><div class="wrap" id="view"></div></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent) || { sessions: [], generated: "" };
const S = DATA.sessions;
const byId = Object.fromEntries(S.map(s => [s.id, s]));

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtNum = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "k" : String(n);
const fmtDur = m => m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
const fmtDate = d => `${d.getMonth() + 1}/${d.getDate()}`;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function relDay(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((today - x) / 864e5);
  if (diff === 0) return "今天";
  if (diff === 1) return "昨天";
  if (diff < 7) return `${diff} 天前`;
  return `${x.getFullYear() === today.getFullYear() ? "" : x.getFullYear() + "/"}${fmtDate(x)}`;
}
function hashHue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
const projColor = p => `hsl(${hashHue(p)} 55% 52%)`;

S.forEach(s => {
  s._start = new Date(s.start); s._end = new Date(s.end);
  s._prompts = s.prompts.length;
  s._sdk = (s.entry || "").startsWith("sdk");
  s._hay = [s.title, s.project, s.repo, s.branches.join(" "), ...s.prompts.map(p => p.text),
            ...s.recaps.map(r => r.text), ...s.compacts.map(c => c.summary)].join("\n").toLowerCase();
});

/* ---------- state ---------- */
const st = { view: "sessions", repo: null, q: "", range: "all", onlyCompact: false, onlyPR: false, showSDK: false, day: null, sort: "recent", limit: 60, open: null };

function filtered() {
  const now = Date.now(), q = st.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  const span = { "7": 7, "30": 30, "90": 90 }[st.range];
  let out = S.filter(s =>
    (!st.repo || s.repo === st.repo) &&
    (!span || now - s._end < span * 864e5) &&
    (!st.onlyCompact || s.compacts.length) &&
    (!st.onlyPR || s.prs.length) &&
    (st.showSDK || !s._sdk) &&
    (!st.day || s.days[st.day]) &&
    terms.every(t => s._hay.includes(t)));
  const key = { recent: s => -s._end, oldest: s => s._start, active: s => -s.activeMin, prompts: s => -s._prompts, tokens: s => -s.outTokens }[st.sort];
  return out.sort((a, b) => key(a) - key(b));
}

function highlight(text, max = 160) {
  const terms = st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let t = String(text).replace(/\s+/g, " ");
  if (terms.length) {
    const i = t.toLowerCase().indexOf(terms[0]);
    if (i > 50) t = "…" + t.slice(i - 40);
  }
  t = t.length > max ? t.slice(0, max) + "…" : t;
  let h = esc(t);
  for (const term of terms) {
    const re = new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    h = h.replace(re, m => `<mark>${m}</mark>`);
  }
  return h;
}
function matchSnippet(s) {
  const terms = st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return "";
  const pools = [...s.prompts.map(p => p.text), ...s.recaps.map(r => r.text), ...s.compacts.map(c => c.summary)];
  const hit = pools.find(t => t.toLowerCase().includes(terms[0]));
  return hit ? highlight(hit) : "";
}

/* ---------- sessions view ---------- */
function tiles(list) {
  const days = new Set(); list.forEach(s => Object.keys(s.days).forEach(d => days.add(d)));
  const sum = f => list.reduce((a, s) => a + f(s), 0);
  const mins = sum(s => s.activeMin);
  return `<div class="tiles">
    <div class="tile"><div class="k">Sessions</div><div class="v">${list.length}</div></div>
    <div class="tile"><div class="k">Prompts</div><div class="v">${fmtNum(sum(s => s._prompts))}</div></div>
    <div class="tile"><div class="k">活躍時數</div><div class="v">${Math.round(mins / 60)}<small>h</small></div></div>
    <div class="tile"><div class="k">Compacts</div><div class="v">${sum(s => s.compacts.length)}</div></div>
    <div class="tile"><div class="k">輸出 tokens</div><div class="v">${fmtNum(sum(s => s.outTokens))}</div></div>
  </div>`;
}
function heatmap(list) {
  const counts = {};
  list.forEach(s => Object.entries(s.days).forEach(([d, n]) => counts[d] = (counts[d] || 0) + n));
  const end = new Date(); end.setHours(0, 0, 0, 0);
  const start = new Date(end); start.setDate(start.getDate() - 7 * 25 - end.getDay());
  const vals = Object.values(counts).sort((a, b) => a - b);
  const q = p => vals[Math.floor((vals.length - 1) * p)] || 1;
  const th = [q(.25), q(.5), q(.75)];
  const lvl = n => !n ? 0 : n <= th[0] ? 1 : n <= th[1] ? 2 : n <= th[2] ? 3 : 4;
  let cells = "", months = "", lastM = -1, lastCol = -9, col = 0, total = 0, activeDays = 0;
  for (let d = new Date(start), i = 0; d <= end; d.setDate(d.getDate() + 1), i++) {
    const k = dkey(d), n = counts[k] || 0;
    total += n; if (n) activeDays++;
    if (d.getDay() === 0) {
      const m = d.getMonth();
      const show = m !== lastM && col - lastCol >= 3;
      months += `<span>${show ? `${m + 1}月` : ""}</span>`;
      if (m !== lastM) lastM = m;
      if (show) lastCol = col;
      col++;
    }
    cells += `<i data-day="${k}" class="${st.day === k ? "sel" : ""}" style="background:var(--heat-${lvl(n)})" title="${k}・${n} prompts"></i>`;
  }
  return `<div class="card"><div class="card-h">活動熱圖<span>近 26 週・${activeDays} 天有活動・${fmtNum(total)} prompts</span></div>
    <div class="heat"><div class="heat-months">${months}</div><div class="heat-grid" id="heat">${cells}</div>
    <div class="heat-legend">少 ${[0, 1, 2, 3, 4].map(l => `<i style="background:var(--heat-${l})"></i>`).join("")} 多
    ${st.day ? `<span class="spacer"></span><button class="link-btn" data-clear-day>清除日期 ${esc(st.day)} ✕</button>` : ""}</div></div></div>`;
}
function topProjects(list) {
  const m = {};
  list.forEach(s => { const r = m[s.repo] ??= { repo: s.repo, project: s.project, min: 0 }; r.min += s.activeMin; });
  const top = Object.values(m).sort((a, b) => b.min - a.min).slice(0, 6);
  const max = top[0]?.min || 1;
  return `<div class="card"><div class="card-h">專案投入<span>活躍時間</span></div><div class="toplist">
    ${top.map(r => `<div class="bar-row" data-repo="${esc(r.repo)}"><span class="bar-name">${esc(r.project)}</span><span class="bar-val">${fmtDur(r.min)}</span>
      <span class="bar"><i style="width:${Math.max(2, r.min / max * 100)}%;background:${projColor(r.repo)}"></i></span></div>`).join("") || '<span class="bar-val">沒有資料</span>'}
  </div></div>`;
}
function rowHtml(s) {
  const d = s._end;
  const sameDay = dkey(s._start) === dkey(d);
  const when = sameDay ? `${hm(s._start)}–${hm(d)}` : `${fmtDate(s._start)} → ${fmtDate(d)} ${hm(d)}`;
  const snip = matchSnippet(s);
  return `<button class="row" data-id="${esc(s.id)}" aria-current="${st.open === s.id}">
    <span class="t">${st.q ? highlight(s.title, 120) : esc(s.title)}</span>
    <span class="when">${when}</span>
    <span class="meta">
      <span class="pchip"><i class="dot" style="background:${projColor(s.repo)}"></i>${esc(s.project)}</span>
      ${s.branches.length ? `<span class="mono">⎇ ${esc(s.branches[s.branches.length - 1])}</span>` : ""}
      <span>${s._prompts} prompts</span><span>${fmtDur(s.activeMin)}</span>
    </span>
    <span class="badges">
      ${s.worktree ? `<span class="badge wt">worktree</span>` : ""}
      ${s._sdk ? `<span class="badge err">SDK</span>` : s.entry === "claude-desktop" ? `<span class="badge wt">Desktop</span>` : ""}
      ${s.prs.length ? `<span class="badge pr">PR ×${s.prs.length}</span>` : ""}
      ${s.compacts.length ? `<span class="badge compact">compact ×${s.compacts.length}</span>` : ""}
      ${s.transcript === false ? `<span class="badge err">無對話頁</span>` : ""}
    </span>
    ${snip ? `<span class="snippet">${snip}</span>` : ""}
  </button>`;
}
function groupLabel(s) {
  if (st.sort !== "recent") return null;
  const r = relDay(s._end);
  return /天前|今天|昨天/.test(r) ? r : `${s._end.getFullYear()} 年 ${s._end.getMonth() + 1} 月`;
}
function toolbar(n) {
  const ranges = [["7", "7 天"], ["30", "30 天"], ["90", "90 天"], ["all", "全部"]];
  const any = st.q || st.repo || st.day || st.onlyCompact || st.onlyPR || st.range !== "all";
  return `<div class="toolbar">
    <div class="seg">${ranges.map(([k, l]) => `<button data-range="${k}" aria-pressed="${st.range === k}">${l}</button>`).join("")}</div>
    <button class="chip" data-toggle="onlyCompact" aria-pressed="${st.onlyCompact}">有 compact</button>
    <button class="chip" data-toggle="onlyPR" aria-pressed="${st.onlyPR}">有 PR</button>
    <button class="chip" data-toggle="showSDK" aria-pressed="${st.showSDK}" title="claude -p / Agent SDK 跑出來的自動化 session">含 SDK session</button>
    ${any ? `<button class="chip clear" data-reset>清除篩選</button>` : ""}
    <span class="spacer"></span>
    <span class="result-n">${n} 筆</span>
    <select class="sort" id="sort" aria-label="排序">
      ${[["recent", "最近活動"], ["oldest", "最早開始"], ["active", "活躍最久"], ["prompts", "Prompt 最多"], ["tokens", "Token 最多"]]
        .map(([k, l]) => `<option value="${k}" ${st.sort === k ? "selected" : ""}>${l}</option>`).join("")}
    </select>
  </div>`;
}
function renderSessions() {
  const list = filtered();
  const scope = S.filter(s => !st.repo || s.repo === st.repo);
  const proj = st.repo && scope[0];
  const head = proj
    ? `<div class="page-h"><div><h1><i class="dot" style="display:inline-block;width:10px;height:10px;background:${projColor(st.repo)};margin-right:8px"></i>${esc(proj.project)}</h1><p class="mono">${esc(st.repo)}</p></div></div>`
    : `<div class="page-h"><div><h1>所有 Sessions</h1><p>${S.length} 個 session，橫跨 ${new Set(S.map(s => s.repo)).size} 個專案</p></div></div>`;
  const groups = [];
  list.slice(0, st.limit).forEach(s => {
    const g = groupLabel(s);
    if (!groups.length || groups[groups.length - 1].label !== g) groups.push({ label: g, rows: [] });
    groups[groups.length - 1].rows.push(rowHtml(s));
  });
  let body = groups.map(g => `${g.label ? `<div class="day-h">${esc(g.label)}</div>` : ""}<div class="list">${g.rows.join("")}</div>`).join("");
  if (list.length > st.limit) body += `<button class="chip more" data-more>再載入 ${Math.min(60, list.length - st.limit)} 筆（共 ${list.length}）</button>`;
  if (!list.length) body = `<div class="empty-state"><b>找不到符合的 session</b>換個關鍵字，或清除篩選看看。</div>`;
  $("#view").innerHTML = head + tiles(scope) +
    `<div class="insights">${heatmap(scope)}${topProjects(scope)}</div>` + toolbar(list.length) + body;
}

/* ---------- compacts view ---------- */
// strip Claude Code's fixed preamble, bold the numbered section headings
function summaryHtml(text) {
  const body = String(text || "").replace(/^This session is being continued[\s\S]*?\n\s*(Summary:\s*\n)?/, "").trim();
  if (!body) return "(沒有摘要內容)";
  const h = st.q ? highlight(body, 1e9) : esc(body);
  return h.replace(/^(\d+\.\s[^\n]+)$/gm, "<b>$1</b>");
}
function compactCard(s, c, i) {
  const d = new Date(c.ts || s.start);
  const ratio = c.pre && c.post ? c.post / c.pre : null;
  const href = s.transcript ? `s/${encodeURIComponent(s.id)}/${c.page || "index.html"}#${c.anchor || ""}` : null;
  return `<div class="cmp">
    <div class="cmp-h">
      <span class="t" data-id="${esc(s.id)}">${esc(s.title)}</span>
      <span class="meta"><span class="pchip"><i class="dot" style="background:${projColor(s.repo)}"></i>${esc(s.project)}</span>
      <span>${d.getFullYear()}/${fmtDate(d)} ${hm(d)}</span>
      ${c.trigger ? `<span class="badge ${c.trigger === "manual" ? "pr" : "compact"}">${c.trigger === "manual" ? "手動 /compact" : "自動 compact"}</span>` : ""}
      ${s.compacts.length > 1 ? `<span>第 ${i + 1}/${s.compacts.length} 次</span>` : ""}</span>
    </div>
    ${ratio !== null ? `<div class="shrink"><span class="mono">${fmtNum(c.pre)}</span><span class="track"><i style="width:${Math.max(1, ratio * 100)}%"></i></span><span class="mono">${fmtNum(c.post)} tokens</span><b style="color:var(--accent-text)">留下 ${(ratio * 100).toFixed(1)}%</b></div>` : ""}
    <div class="summary">${summaryHtml(c.summary)}</div>
    <div class="actions">
      <button class="link-btn" data-expand>展開全文</button>
      ${href ? `<a class="link-btn" href="${href}">在對話中查看 →</a>` : ""}
    </div>
  </div>`;
}
function renderCompacts() {
  const terms = st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const items = [];
  S.filter(s => !st.repo || s.repo === st.repo).forEach(s => s.compacts.forEach((c, i) => {
    const hay = (s.title + "\n" + c.summary + "\n" + s.project).toLowerCase();
    if (terms.every(t => hay.includes(t))) items.push([s, c, i]);
  }));
  items.sort((a, b) => new Date(b[1].ts || b[0].start) - new Date(a[1].ts || a[0].start));
  const withMeta = items.filter(([, c]) => c.pre && c.post);
  const avg = withMeta.length ? withMeta.reduce((a, [, c]) => a + c.post / c.pre, 0) / withMeta.length : null;
  const dropped = withMeta.reduce((a, [, c]) => a + (c.pre - c.post), 0);
  $("#view").innerHTML = `
    <div class="page-h"><div><h1>Compact 時間軸</h1><p>每次 compact 後 Claude 帶著走的摘要。展開全文，或跳回對話看 compact 前發生了什麼。</p></div></div>
    <div class="tiles" style="grid-template-columns:repeat(3,1fr)">
      <div class="tile"><div class="k">Compacts</div><div class="v">${items.length}</div></div>
      <div class="tile"><div class="k">平均保留</div><div class="v">${avg === null ? "—" : (avg * 100).toFixed(1)}<small>${avg === null ? "" : "%"}</small></div></div>
      <div class="tile"><div class="k">壓掉的 context</div><div class="v">${fmtNum(dropped)}<small>tokens</small></div></div>
    </div>
    ${items.length ? `<div class="card">${items.map(([s, c, i]) => compactCard(s, c, i)).join("")}</div>`
      : `<div class="empty-state"><b>沒有 compact 紀錄</b>${st.q ? "換個關鍵字試試。" : "這個範圍內的 session 都還沒被 compact 過。"}</div>`}`;
}

/* ---------- drawer ---------- */
function openDrawer(id) {

  history.replaceState(null, "", "#s=" + encodeURIComponent(id));

  ].filter(e => e.ts).sort((a, b) => a.ts.localeCompare(b.ts));
  let tl = "", lastD = "";

      </div>

      ${s.compacts.length ? `<div class="sec-h">Compacts<span>${s.compacts.length} 次</span></div><div class="card" style="overflow:hidden">${s.compacts.map((c, i) => compactCard(s, c, i)).join("")}</div>` : ""}
